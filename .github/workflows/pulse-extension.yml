name: Pulse extension checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m compileall -q demo_admin.py tenant_gateway.py extension_source.py extension_archive.py extension_portfolio.py investor_portfolio.py pulse_auth_monitor.py scripts/render_nginx.py
      - name: Run read-only source tests
        run: python -m unittest discover -s tests -p 'test_extension_*.py' -v
      - name: Existing Python regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check nginx template render
        run: python scripts/render_nginx.py invest.argokov.ru --https --multi-user > /tmp/t-invest-test.conf
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JS
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js
          node --check extension/portfolio.js
      - name: Validate admin inline JavaScript
        run: |
          node -e "const fs=require('fs'); const src=fs.readFileSync('demo/index.html','utf8'); const blocks=[...src.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/g)]; for(const b of blocks) new Function(b[1]); if(!blocks.length) process.exit(1)"
      - name: Verify simulated Brave history loading
        run: node tests/test_extension_history.cjs
      - name: Validate browser-only source design
        run: |
          node -e "const fs=require('fs'); const content=fs.readFileSync('extension/content.js','utf8'); if(!content.includes('totalOperationsCount') || !content.includes('nextCursor') || !content.includes('verifyAuthor')) process.exit(1)"
          node -e "const fs=require('fs'); const background=fs.readFileSync('extension/background.js','utf8'); if(!background.includes('X-TInvest-Extension-Key') || !background.includes('chrome.webRequest')) process.exit(1)"
      - name: Validate MV3 manifest
        run: |
          node -e "const m=require('./extension/manifest.json'); if(m.manifest_version!==3 || !m.background.service_worker || !m.content_scripts.some(x=>x.js.includes('portfolio.js'))) process.exit(1)"
